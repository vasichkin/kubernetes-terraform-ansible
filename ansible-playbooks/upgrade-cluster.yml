# Rolling upgrade of an already-running kubeadm cluster from v1.29 to v1.36.
#
# kubeadm only supports upgrading one minor version at a time, so this steps
# through every intermediate minor release in order: for each hop it upgrades
# the control plane first (kubeadm upgrade apply, drain, kubelet/kubectl,
# uncordon), then rolls the workers one at a time (kubeadm upgrade node,
# drain/uncordon delegated to the master, kubelet). This keeps master/worker
# version skew minimal throughout instead of upgrading one node fully before
# touching the next.
#
# Safe to re-run: each apt repo switch is idempotent, and each
# `kubeadm upgrade apply`/`kubeadm upgrade node` step is guarded by a
# `creates:` sentinel log file, so a re-run after a failed/interrupted hop
# resumes from where it left off instead of repeating completed hops.
#
# Run from repo root: ansible-playbook -i dynamic_inventory.py ansible-playbooks/upgrade-cluster.yml
- import_playbook: upgrade-cluster-step.yml
  vars:
    kube_version: "1.30"
- import_playbook: upgrade-cluster-step.yml
  vars:
    kube_version: "1.31"
- import_playbook: upgrade-cluster-step.yml
  vars:
    kube_version: "1.32"
- import_playbook: upgrade-cluster-step.yml
  vars:
    kube_version: "1.33"
- import_playbook: upgrade-cluster-step.yml
  vars:
    kube_version: "1.34"
- import_playbook: upgrade-cluster-step.yml
  vars:
    kube_version: "1.35"
- import_playbook: upgrade-cluster-step.yml
  vars:
    kube_version: "1.36"
